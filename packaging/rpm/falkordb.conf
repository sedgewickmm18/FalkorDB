# FalkorDB configuration (redis-server config file syntax).
# Managed by the falkordb RPM; local edits are preserved on upgrade.

# Listen on loopback only by default. Change `bind` (and set `requirepass`
# or ACLs) before exposing the server to the network.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

# Run in the foreground; systemd supervises the process.
daemonize no
supervised systemd

dir /var/lib/falkordb
# Logging goes to the journal: journalctl -u falkordb
logfile ""

# Persistence
dbfilename dump.rdb
save 3600 1 300 100 60 10000

# The FalkorDB module and its arguments.
loadmodule /usr/lib64/falkordb/falkordb.so MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000
